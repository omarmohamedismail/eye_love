<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eye Love</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020208}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,eye=[],heart=[],stars=[],begin=performance.now();
const clamp=x=>Math.max(0,Math.min(1,x)),ease=(a,b,t)=>{let q=clamp((t-a)/(b-a));return q*q*(3-2*q)},rnd=n=>{let q=Math.sin(n*127.1+78.233)*43758.5453;return q-Math.floor(q)};
function init(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);eye=[];heart=[];stars=[];let i=0;for(let y=-48;y<=48;y++)for(let x=-85;x<=85;x++){let u=x/85,v=y/48;let lid=.56*Math.pow(Math.max(0,1-u*u),.73);if(Math.abs(v)<lid){eye.push({u,v,n:rnd(i+2),n2:rnd(i+602),p:rnd(i+900)*6.283});}i++}
i=0;for(let y=-65;y<=65;y++)for(let x=-65;x<=65;x++){let u=x/55,v=-y/55;let F=Math.pow(u*u+v*v-1,3)-u*u*v*v*v;if(F<=0){heart.push({u,v:-v,n:rnd(i+3),p:rnd(i+805)*6.283,edge:Math.abs(F)});}i++}
for(let j=0;j<130;j++)stars.push({x:rnd(j+8)*W,y:rnd(j+900)*H,r:rnd(j+700)*1.4,p:rnd(j+500)*6.28})}addEventListener('resize',init);init();
function render(ms){let t=((ms-begin)/1000)%13.5,cx=W/2,cy=H/2,B=Math.min(W*.46,H*.77,570),zoom=1+ease(4.6,7.55,t)*105,vanish=ease(6.8,8.05,t),show=ease(7.45,8.55,t);
g.fillStyle='#020208';g.fillRect(0,0,W,H);for(let s of stars){g.globalAlpha=.08+.17*(.5+.5*Math.sin(ms*.001+s.p));g.fillStyle='#a7a8df';g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;
let gazeX=.075*Math.sin(t*1.45),gazeY=.03*Math.sin(t*.9),blink=1-.96*Math.max(0,1-Math.abs(t-2.75)/.16)**2;
if(vanish<1){g.save();g.translate(cx,cy);g.scale(zoom,zoom);g.shadowBlur=0;
for(let p of eye){let yy=p.v*blink,ap=.56*Math.pow(Math.max(0,1-p.u*p.u),.73),edge=clamp((ap-Math.abs(yy))*38),dx=p.u-gazeX,dy=(yy-gazeY)*1.5,r=Math.hypot(dx,dy),iris=r<.38,pupil=r<.175;let hue,sat,light,alpha=(1-vanish)*edge*(.84+.16*p.n);
if(pupil){hue=248;sat=48;light=2+3*p.n}else if(iris){let ang=Math.atan2(dy,dx),fiber=.5+.5*Math.sin(ang*115+r*170+p.p),inner=clamp((r-.175)/.205);hue=185+85*p.n2;sat=65+30*p.n;light=14+45*fiber*inner+15*p.n}else{let blood=clamp((Math.abs(yy)-ap*.62)*4);hue=232+95*blood;sat=14+36*blood;light=83+12*p.n-20*blood}
let glint=Math.hypot(dx+.11,dy+.145);if(glint<.055){hue=195;sat=15;light=100;alpha=1-vanish}
g.fillStyle='hsla('+hue+','+sat+'%,'+light+'%,'+alpha+')';let q=Math.max(1.2,B/152)*(0.83+.3*p.n);g.fillRect(p.u*B-q/2,yy*B-q/2,q,q)}
g.restore();
g.save();g.translate(cx,cy);g.scale(zoom,zoom);g.globalAlpha=(1-vanish)*.73;g.lineWidth=Math.max(1,B/310);g.strokeStyle='#c6a8ee';g.shadowColor='#b879ff';g.shadowBlur=17;g.beginPath();g.moveTo(-B,0);g.bezierCurveTo(-B*.66,-B*.72*blink,B*.66,-B*.72*blink,B,0);g.stroke();g.beginPath();g.moveTo(-B,0);g.bezierCurveTo(-B*.68,B*.70*blink,B*.68,B*.70*blink,B,0);g.stroke();g.restore()}
if(show>0){let beat=1+.045*Math.pow(Math.max(0,Math.sin(ms*.0065)),5),S=Math.min(W*.27,H*.38,210)*beat;let halo=g.createRadialGradient(cx,cy,0,cx,cy,S*1.8);halo.addColorStop(0,'rgba(255,30,100,'+(.23*show)+')');halo.addColorStop(1,'rgba(255,30,100,0)');g.fillStyle=halo;g.fillRect(cx-S*2,cy-S*2,S*4,S*4);
g.save();g.translate(cx,cy);g.shadowColor='#ff2a68';g.shadowBlur=9;for(let p of heart){let bright=clamp(.38+.48*(-p.v+1)/2+.18*p.n),spark=.85+.15*Math.sin(ms*.004+p.p);g.globalAlpha=show*spark;let h=338+16*p.n,light=28+38*bright;g.fillStyle='hsl('+h+',95%,'+light+'%)';let q=Math.max(1.4,S/68)*(.85+.25*p.n);g.fillRect(p.u*S-q/2,p.v*S-q/2,q,q)}g.restore()}
g.globalAlpha=1;requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
