<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eye Love</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="scene"></canvas><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W,H,D,eyeDots=[],heartDots=[],dust=[],start=performance.now();const clamp=x=>Math.max(0,Math.min(1,x)),ease=(a,b,t)=>{let x=clamp((t-a)/(b-a));return x*x*(3-2*x)};function rand(n){let x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)}
function setup(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);eyeDots=[];heartDots=[];dust=[];let k=0;for(let y=-44;y<=44;y++)for(let x=-74;x<=74;x++){let u=x/74,v=y/44;let aperture=.48*Math.pow(Math.max(0,1-u*u),.66);if(Math.abs(v)<aperture){let noise=rand(++k);eyeDots.push({u,v,n:noise,p:rand(k+700)*6.28,sz:.7+rand(k+100)*.7})}let hx=u*1.25,hy=-v*1.5;let heart=Math.pow(hx*hx+hy*hy-1,3)-hx*hx*hy*hy*hy;if(heart<0&&Math.abs(u)<.93&&Math.abs(v)<.85)heartDots.push({u,v,n:rand(k+3000),p:rand(k+5000)*6.28})}for(let i=0;i<150;i++)dust.push({x:rand(i+1)*W,y:rand(i+200)*H,r:rand(i+400)*1.5,p:rand(i+600)*6.28})}addEventListener('resize',setup);setup();
function loop(ms){let t=((ms-start)/1000)%13.5;ctx.fillStyle='#020307';ctx.fillRect(0,0,W,H);let cx=W/2,cy=H/2,base=Math.min(W*.45,H*.72,560),lookX=Math.sin(t*1.35)*.09,lookY=Math.sin(t*.8)*.035,blink=1-.94*Math.pow(Math.max(0,1-Math.abs(t-2.65)/.14),2),z=1+ease(4.3,7.6,t)*95,transition=ease(6.5,8,t),appear=ease(7.1,8.4,t);for(let d of dust){ctx.globalAlpha=.08+.2*(.5+.5*Math.sin(ms*.0008+d.p));ctx.fillStyle='#a4a4ff';ctx.fillRect(d.x,d.y,d.r,d.r)}ctx.globalAlpha=1;
if(transition<1){ctx.save();ctx.translate(cx,cy);ctx.scale(z,z);let irisRadius=.31,puRadius=.137;for(let p of eyeDots){let y=p.v*blink,dx=p.u-lookX,dy=y-lookY,dist=Math.hypot(dx,dy*1.65),iris=dist<irisRadius,pupil=dist<puRadius;let edge=Math.abs(y)/(.48*Math.pow(Math.max(0,1-p.u*p.u),.66)+.001);let opacity=(1-transition)*(.68+.32*p.n)*clamp((1-edge)*7);if(opacity<=0)continue;let hue,sat,light;if(pupil){hue=255;sat=45;light=2+p.n*5}else if(iris){let angle=Math.atan2(dy,dx),stripes=.5+.5*Math.sin(angle*92+dist*140+p.p);hue=190+85*p.n;sat=70+20*p.n;light=15+43*stripes*(dist/irisRadius)+10*p.n}else{hue=225+30*p.n;sat=25+35*p.n;light=69+24*p.n}let spec=Math.hypot(dx+.105,dy+.12);if(spec<.045){hue=200;sat=15;light=99;opacity=1-transition}ctx.fillStyle='hsla('+hue+','+sat+'%,'+light+'%,'+opacity+')';let dot=Math.max(1.15,base/125)*p.sz;ctx.fillRect(p.u*base-dot/2,y*base-dot/2,dot,dot)}ctx.restore();ctx.save();ctx.globalAlpha=(1-transition)*.55;ctx.translate(cx,cy);ctx.scale(z,z);ctx.strokeStyle='#d5c7ff';ctx.lineWidth=1.5;ctx.shadowColor='#8d65ff';ctx.shadowBlur=17;ctx.beginPath();ctx.moveTo(-base*.98,0);ctx.quadraticCurveTo(0,-base*.72*blink,base*.98,0);ctx.stroke();ctx.beginPath();ctx.moveTo(-base*.98,0);ctx.quadraticCurveTo(0,base*.72*blink,base*.98,0);ctx.stroke();ctx.restore()}
if(appear>0){let beat=1+.055*Math.sin(ms*.006)*Math.sin(ms*.006),S=Math.min(W*.35,H*.52,270)*beat;let halo=ctx.createRadialGradient(cx,cy,0,cx,cy,S*1.6);halo.addColorStop(0,'rgba(255,25,90,'+(.18*appear)+')');halo.addColorStop(1,'rgba(255,25,90,0)');ctx.fillStyle=halo;ctx.fillRect(cx-S*2,cy-S*2,S*4,S*4);ctx.save();ctx.translate(cx,cy);ctx.shadowColor='#ff286b';ctx.shadowBlur=13;for(let p of heartDots){let flick=.78+.22*Math.sin(ms*.003+p.p);ctx.globalAlpha=appear*flick;ctx.fillStyle=p.n>.83?'#ffc0d5':p.n>.35?'#ff386c':'#c80843';let q=Math.max(1.7,S/94)*(0.8+p.n*.6);ctx.fillRect(p.u*S-q/2,p.v*S-q/2,q,q)}ctx.restore()}ctx.globalAlpha=1;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
