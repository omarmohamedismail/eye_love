<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eye Love</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030309}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="scene"></canvas><script>
const c=document.getElementById('scene'),g=c.getContext('2d');let w,h,d,stars=[];function resize(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);stars=Array.from({length:100},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,p:Math.random()*6.28}))}addEventListener('resize',resize);resize();
const start=performance.now();function heart(x,y,s,t){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(0,19);g.bezierCurveTo(-7,12,-28,-3,-22,-17);g.bezierCurveTo(-16,-31,-2,-27,0,-17);g.bezierCurveTo(5,-29,20,-30,24,-16);g.bezierCurveTo(29,-1,9,13,0,19);g.closePath();g.shadowColor='#ff215b';g.shadowBlur=35;let gr=g.createLinearGradient(-25,-25,24,22);gr.addColorStop(0,'#ff8aaa');gr.addColorStop(.4,'#ff275c');gr.addColorStop(1,'#a70038');g.fillStyle=gr;g.fill();g.restore()}
function draw(now){let t=((now-start)/1000)%11;g.fillStyle='#030309';g.fillRect(0,0,w,h);let cx=w/2,cy=h/2,base=Math.min(w*.72,h*.75,610),zoom=t<3.6?1:t<6.2?Math.exp((t-3.6)*2.5):t<8?700:1;let fade=t<6?1:t<7?Math.max(0,7-t):0;
for(let s of stars){g.globalAlpha=.2+.3*(1+Math.sin(now*.001+s.p))/2;g.fillStyle='#abb6ff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;
if(fade>0){g.save();g.translate(cx,cy);g.scale(zoom,zoom);g.globalAlpha=fade;let ex=base*.46,ey=base*.23;g.shadowColor='#a84bff';g.shadowBlur=45;g.beginPath();g.moveTo(-ex,0);g.bezierCurveTo(-ex*.65,-ey*1.35,ex*.65,-ey*1.35,ex,0);g.bezierCurveTo(ex*.65,ey*1.35,-ex*.65,ey*1.35,-ex,0);g.closePath();let white=g.createLinearGradient(0,-ey,0,ey);white.addColorStop(0,'#d5d4ff');white.addColorStop(.5,'#f8f4ff');white.addColorStop(1,'#8063ba');g.fillStyle=white;g.fill();g.shadowBlur=0;g.save();g.clip();let look=Math.sin(now*.0016)*base*.035,iy=Math.sin(now*.0011)*base*.017;g.translate(look,iy);let rad=base*.205;let iris=g.createRadialGradient(0,0,rad*.08,0,0,rad);iris.addColorStop(0,'#070313');iris.addColorStop(.34,'#17062e');iris.addColorStop(.6,'#7040b4');iris.addColorStop(.86,'#4bd8ed');iris.addColorStop(1,'#10102b');g.fillStyle=iris;g.beginPath();g.arc(0,0,rad,0,7);g.fill();for(let i=0;i<110;i++){let a=i*Math.PI*2/110;g.strokeStyle=i%3?'#b37aff66':'#70e9ff99';g.lineWidth=1.1;g.beginPath();g.moveTo(Math.cos(a)*rad*.44,Math.sin(a)*rad*.44);g.lineTo(Math.cos(a+.018)*rad*.94,Math.sin(a+.018)*rad*.94);g.stroke()}g.fillStyle='#020208';g.beginPath();g.arc(0,0,rad*.48,0,7);g.fill();g.fillStyle='#ffffffbb';g.beginPath();g.ellipse(-rad*.35,-rad*.42,rad*.19,rad*.09,-.65,0,7);g.fill();g.restore();g.restore();g.strokeStyle='#bd7cff';g.lineWidth=3;g.shadowColor='#a45aff';g.shadowBlur=20;g.beginPath();g.moveTo(cx-base*.46,cy);g.quadraticCurveTo(cx,cy-base*.45,cx+base*.46,cy);g.stroke();g.beginPath();g.moveTo(cx-base*.46,cy);g.quadraticCurveTo(cx,cy+base*.45,cx+base*.46,cy);g.stroke();g.restore()}
if(t>=6.4){let a=Math.min(1,(t-6.4)*1.5),scale=(1+.07*Math.sin(now*.006))*Math.min(w,h)/220;g.globalAlpha=a;let glow=g.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*.35);glow.addColorStop(0,'#7f0c3855');glow.addColorStop(1,'#00000000');g.fillStyle=glow;g.fillRect(0,0,w,h);heart(cx,cy,scale);g.textAlign='center';g.font='500 '+Math.max(18,Math.min(w/15,32))+'px Arial';g.fillStyle='#ffbfd0';g.fillText('EYE LOVE',cx,cy+Math.min(w,h)*.25);g.globalAlpha=1}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
