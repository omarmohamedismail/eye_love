<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eye → Space</title>
<style>
:root{color-scheme:dark;--bg:#050505;--win:#e9edf2;--title:#555;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.win{width:min(96vw,900px);height:min(86vh,720px);display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px #000;background:#000}
.bar{background:var(--win);color:var(--title);font-size:12px;padding:6px 10px;display:flex;justify-content:space-between}
#c{flex:1;width:100%;min-height:0;display:block;background:#000}
</style>
</head>
<body>
<div class="win"><div class="bar"><span>Eye → Space</span><span>✕</span></div><canvas id="c"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RAMP=" .'`^\",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const FS=11,CW=FS*0.6,CH=FS*1.1,T=16;
let W,H,cols,rows,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cols=Math.floor(W/CW);rows=Math.floor(H/CH);ctx.font=FS+'px monospace';ctx.textBaseline='top'}
addEventListener('resize',resize);resize();
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const hash=(i,j)=>{const s=Math.sin(i*12.9898+j*78.233)*43758.5453;return s-Math.floor(s)};
const stars=[];for(let k=0;k<260;k++)stars.push({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,big:Math.random()<0.12,sp:1+Math.random()*2});
function eye(x,y,t){
  const bp=(t%5)/5,bl=bp>0.92?Math.sin((bp-0.92)/0.08*Math.PI):0,open=1-bl*0.95;
  const gx=0.14*Math.sin(t*0.9),gy=0.05*Math.cos(t*1.3);
  const lid=0.5*Math.pow(Math.max(0,1-x*x/1.2),0.8)*open,ay=Math.abs(y);
  if(ay<lid){
    const edge=ay/lid,d=Math.hypot(x-gx,y-gy);let b,c;
    if(Math.hypot(x-gx+0.12,y-gy+0.12)<0.06){return [255,255,255,1]}
    if(d<0.4){
      if(d<0.16){b=0.06;c=[255,120,60]}
      else{const f=0.5+0.5*Math.sin(Math.atan2(y-gy,x-gx)*18+d*10);b=0.35+0.45*f*(d/0.4)+0.15;c=[255,150,55]}
    }else{b=0.8-0.45*edge*edge;c=[255,205,160]}
    b*=1-0.5*Math.pow(edge,3);return [c[0],c[1],c[2],b];
  }
  const dl=ay-lid,rdg=Math.exp(-Math.pow((dl-0.12)/0.05,2))*0.2;
  return [210,115,50,Math.max(0,0.45*Math.exp(-dl*1.3)+rdg)];
}
function heart(u,v,t){
  const hb=1+0.09*Math.pow(Math.max(0,Math.sin(t*6)),8),sc=0.36*hb;
  const x=u/sc,y=-v/sc+0.1,q=x*x+y*y-1,f=q*q*q-x*x*y*y*y;
  if(f<0){const hl=Math.exp(-((x+0.55)*(x+0.55)+(y-0.45)*(y-0.45))*3);
    return [255,45,80,Math.min(1,0.3+0.5*Math.min(1,-f*1.5)+0.45*hl)]}
  if(f<0.7){const g=1-f/0.7;return [255,45,80,0.28*g*g]}
  return null;
}
function frame(ms){
  const t=ms/1000,p=(t%T)/T;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const s=0.95-0.2*sm(0.1,0.8,p),R=0.04+2.4*sm(0.12,0.78,p),m=sm(0.45,0.78,p),op=sm(0.12,0.7,p);
  const g=sm(0,0.04,p)*(1-sm(0.94,1,p)),unit=Math.min(W,H)*0.5;
  for(let j=0;j<rows;j++){for(let i=0;i<cols;i++){
    const u=((i+0.5-cols/2)*CW)/unit,v=((j+0.5-rows/2)*CH)/unit,x=u/s,y=v/s,d=Math.hypot(x,y);
    let r,gg,b,B0;
    if(d<R){
      const h=m>0?heart(u,v,t):null;
      if(!h)continue;
      r=h[0];gg=h[1];b=h[2];B0=h[3]*m;
    }else{
      const e=eye(x,y,t);r=e[0];gg=e[1];b=e[2];B0=e[3];
      const rim=Math.exp(-Math.pow((d-R)/0.06,2));
      if(rim>0.02&&op>0){B0=Math.max(B0,0.9*rim);r=255;gg=170;b=90}
    }
    const B=Math.min(1,B0)*g*(0.93+0.07*hash(i,j+Math.floor(t*8)));
    if(B<0.05)continue;
    const ch=RAMP[Math.min(RAMP.length-1,Math.floor(B*(RAMP.length-1)))];
    ctx.fillStyle=`rgb(${r*B|0},${gg*B|0},${b*B|0})`;
    ctx.fillText(ch,i*CW,j*CH);
  }}
  const k=0.3+0.7*sm(0.12,0.8,p);
  for(const st of stars){
    const i=Math.floor(cols/2+(st.x-0.5)*cols*k),j=Math.floor(rows/2+(st.y-0.5)*rows*k);
    if(i<1||j<1||i>=cols-1||j>=rows-1)continue;
    const u=((i+0.5-cols/2)*CW)/unit,v=((j+0.5-rows/2)*CH)/unit;
    if(Math.hypot(u/s,v/s)>R-0.05)continue;
    const a=g*(0.4+0.6*Math.abs(Math.sin(t*st.sp+st.ph)));
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    if(st.big){
      ctx.fillText('+',i*CW,j*CH);
      ctx.fillText('|',i*CW,(j-1)*CH);ctx.fillText('|',i*CW,(j+1)*CH);
      ctx.fillText('-',(i-1)*CW,j*CH);ctx.fillText('-',(i+1)*CW,j*CH);
    }else ctx.fillText(Math.random()<0.5?'.':'•',i*CW,j*CH);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
