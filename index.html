<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eye Love</title><style>html,body{margin:0;width:100%;height:100%;background:#020205;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let w,h,d,points=[],start=performance.now();
const smooth=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function resize(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);points=[];for(let y=-32;y<=32;y++)for(let x=-52;x<=52;x++){let X=x/52,Y=y/32;let boundary=Math.pow(Math.abs(X),1.5)+Math.pow(Math.abs(Y)*1.65,1.65);let iris=Math.hypot(X*1.4,Y*1.4);let eyelid=Math.abs(Y)<.48*Math.sqrt(Math.max(0,1-X*X));let eye=eyelid&&Math.abs(X)<1;let heartX=X*1.25,heartY=Y*1.15;let hx=heartX,hy=-heartY;let eq=Math.pow(hx*hx+hy*hy-1,3)-hx*hx*hy*hy*hy;points.push({x:X,y:Y,eye,iris,heart:eq<=0&&Math.abs(X)<.95&&Math.abs(Y)<.95,r:Math.random(),phase:Math.random()*6.28})}}resize();addEventListener('resize',resize);
function frame(now){let t=((now-start)/1000)%12;ctx.fillStyle='#020205';ctx.fillRect(0,0,w,h);let size=Math.min(w*.43,h*.67,400),zoom=1+smooth(3.6,6.8,t)*24,heart=smooth(6.1,7.6,t),pulse=1+.055*Math.sin(now*.006);ctx.save();ctx.translate(w/2,h/2);ctx.scale(zoom,zoom);let look=Math.sin(t*1.9)*.075;for(const p of points){if(!p.eye)continue;let r=Math.hypot((p.x-look)*1.4,p.y*1.4);let iris=r<.49,pupil=r<.235;let col=pupil?'#05020d':iris?(r<.32?'#5a27b9':r<.42?'#a865ff':'#57e6f5'):'#b6a6e0';let edge=Math.abs(p.y)-.48*Math.sqrt(Math.max(0,1-p.x*p.x));let alpha=(1-heart)*(.6+.4*Math.sin(p.phase+now*.002)**2);ctx.globalAlpha=alpha;ctx.fillStyle=col;let px=p.x*size,py=p.y*size;ctx.fillRect(px,py,Math.max(2,size/55),Math.max(2,size/55))}ctx.restore();
if(heart>0){ctx.save();ctx.translate(w/2,h/2);ctx.scale(pulse,pulse);let unit=Math.min(w*.29,h*.4,210);for(const p of points){if(!p.heart)continue;let x=p.x*unit*1.25,y=p.y*unit*1.25;ctx.globalAlpha=heart*(.7+.3*Math.sin(now*.003+p.phase)**2);ctx.fillStyle=p.r>.7?'#ffb0ca':p.r>.35?'#ff346a':'#d50948';ctx.fillRect(x,y,Math.max(2,unit/45),Math.max(2,unit/45))}ctx.restore()}ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
